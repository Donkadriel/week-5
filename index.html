<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 — JavaScript Exercises</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        p {
            margin: 0 0 28px;
            color: #94a3b8;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: min(340px, 90vw);
        }

        nav a {
            display: block;
            padding: 16px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 1.05rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        nav a:hover,
        nav a:focus {
            background: #273549;
            border-color: #38bdf8;
        }

        nav a span {
            display: block;
            margin-top: 4px;
            font-size: 0.82rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>Week 5 Exercises</h1>
    <p>Choose an exercise to view.</p>

    <nav>
        <a href="fizzBuzz.html">
            FizzBuzz
            <span>Numbers 1–100 with Fizz / Buzz substitution</span>
